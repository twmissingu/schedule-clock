      <line x1="35" y1="52" x2="45" y2="52" stroke="#D2691E" stroke-width="2"/>
      <line x1="62" y1="38" x2="72" y2="38" stroke="#D2691E" stroke-width="2"/>
      <line x1="62" y1="45" x2="75" y2="45" stroke="#D2691E" stroke-width="2"/>
