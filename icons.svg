    <symbol id="icon-english" viewBox="0 0 100 100">
      <text x="50" y="35" text-anchor="middle" font-size="24" font-weight="bold" fill="#4169E1">ABC</text>
      <text x="50" y="60" text-anchor="middle" font-size="20" font-weight="bold" fill="#87CEEB">123</text>
      <text x="50" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFB6C1">XYZ</text>
      <circle cx="20" cy="25" r="8" fill="#FFE4E9"/>
      <circle cx="80" cy="70" r="8" fill="#E0F4FF"/>
