    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <symbol id="icon-edit" viewBox="0 0 24 24">
      <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" stroke="currentColor" stroke-width="2" fill="none"/>
      <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" stroke="currentColor" stroke-width="2" fill="none"/>
    </symbol>

    <symbol id="icon-delete" viewBox="0 0 24 24">
      <path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z" stroke="currentColor" stroke-width="2" fill="none"/>
    </symbol>

    <symbol id="icon-bell" viewBox="0 0 100 100">
      <path d="M50 20 C30 20 20 35 20 50 L20 70 L80 70 L80 50 C80 35 70 20 50 20" fill="#FFD700" stroke="#FFA500" stroke-width="4"/>
      <rect x="40" y="70" width="20" height="15" rx="3" fill="#FFD700" stroke="#FFA500" stroke-width="4"/>
      <circle cx="50" cy="45" r="8" fill="#FFA500"/>
