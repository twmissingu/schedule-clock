      <ellipse cx="50" cy="60" rx="35" ry="30" fill="#FFE4E9" stroke="#FFB6C1" stroke-width="3"/>
      <circle cx="38" cy="52" r="5" fill="#333"/>
      <circle cx="62" cy="52" r="5" fill="#333"/>
