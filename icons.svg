      <path d="M50 20 L50 30 M50 70 L50 80 M20 50 L30 50 M70 50 L80 50" stroke="#90EE90" stroke-width="3"/>
      <circle cx="50" cy="50" r="15" fill="#FFD700"/>
      <polygon points="50,40 53,48 62,48 55,53 58,62 50,57 42,62 45,53 38,48 47,48" fill="#FFA500"/>
    </symbol>

