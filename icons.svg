      <ellipse cx="50" cy="60" rx="35" ry="30" fill="#FFE4E9" stroke="#FFB6C1" stroke-width="3"/>
      <circle cx="38" cy="52" r="5" fill="#333"/>
      <circle cx="62" cy="52" r="5" fill="#333"/>
      <ellipse cx="50" cy="65" rx="6" ry="4" fill="#FFB6C1"/>
      <circle cx="30" cy="75" r="10" fill="#FFB6C1" opacity="0.5"/>
      <circle cx="70" cy="75" r="10" fill="#FFB6C1" opacity="0.5"/>
    </symbol>

    <symbol id="icon-bear" viewBox="0 0 100 100">
