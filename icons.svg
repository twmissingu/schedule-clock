      <circle cx="50" cy="50" r="35" fill="none" stroke="#FFB6C1" stroke-width="2" stroke-dasharray="5,5"/>
      <line x1="50" y1="50" x2="50" y2="25" stroke="#FF69B4" stroke-width="4" stroke-linecap="round"/>
      <line x1="50" y1="50" x2="70" y2="50" stroke="#4169E1" stroke-width="3" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="5" fill="#FF69B4"/>
      <text x="50" y="18" text-anchor="middle" font-size="10" fill="#FF69B4">12</text>
      <text x="82" y="54" text-anchor="middle" font-size="10" fill="#FF69B4">3</text>
      <text x="50" y="90" text-anchor="middle" font-size="10" fill="#FF69B4">6</text>
      <text x="18" y="54" text-anchor="middle" font-size="10" fill="#FF69B4">9</text>
