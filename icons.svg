    <symbol id="icon-star" viewBox="0 0 100 100">
      <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
    </symbol>

    <symbol id="icon-piano" viewBox="0 0 100 100">
      <rect x="10" y="30" width="80" height="50" rx="5" fill="#333"/>
      <rect x="15" y="35" width="10" height="40" fill="white"/>
      <rect x="27" y="35" width="10" height="40" fill="white"/>
      <rect x="39" y="35" width="10" height="40" fill="white"/>
      <rect x="51" y="35" width="10" height="40" fill="white"/>
      <rect x="63" y="35" width="10" height="40" fill="white"/>
      <rect x="75" y="35" width="10" height="40" fill="white"/>
      <rect x="22" y="35" width="8" height="25" fill="#333"/>
      <rect x="46" y="35" width="8" height="25" fill="#333"/>
      <rect x="58" y="35" width="8" height="25" fill="#333"/>
      <rect x="70" y="35" width="8" height="25" fill="#333"/>
    </symbol>

    <symbol id="icon-dance" viewBox="0 0 100 100">
