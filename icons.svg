      <polygon points="75,68 90,30 95,35 80,68" fill="#FFE4C4"/>
      <rect x="15" y="25" width="35" height="35" rx="5" fill="#FFF8DC" stroke="#DEB887" stroke-width="2"/>
      <circle cx="25" cy="35" r="6" fill="#FF6B6B"/>
      <circle cx="40" cy="40" r="6" fill="#4ECDC4"/>
      <circle cx="32" cy="52" r="6" fill="#FFE66D"/>
