<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小可爱日程时钟</title>
  <link rel="stylesheet" href="styles.css">
  <script src="js/icons.js"></script>
</head>
<body>

  <svg class="sticker sticker-bunny"><use href="#icon-bunny"/></svg>
  <svg class="sticker sticker-bear"><use href="#icon-bear"/></svg>
  <svg class="sticker sticker-cat"><use href="#icon-cat"/></svg>
  <svg class="sticker sticker-star"><use href="#icon-star"/></svg>
  <svg class="sticker sticker-star-2"><use href="#icon-star"/></svg>

  <div class="app-container">
    <div class="clock-card">
      <div class="clock-face" id="clockFace">
        <div class="clock-numbers">
          <span class="clock-number" style="top: 15%; left: 50%; transform: translateX(-50%);">12</span>
          <span class="clock-number" style="top: 28%; right: 20%;">1</span>
          <span class="clock-number" style="top: 45%; right: 8%;">2</span>
          <span class="clock-number" style="top: 65%; right: 15%;">3</span>
          <span class="clock-number" style="bottom: 15%; left: 50%; transform: translateX(-50%);">6</span>
          <span class="clock-number" style="top: 65%; left: 15%;">9</span>
          <span class="clock-number" style="top: 45%; left: 8%;">10</span>
          <span class="clock-number" style="top: 28%; left: 20%;">11</span>
        </div>
        <div class="clock-hand hour-hand" id="hourHand"></div>
        <div class="clock-hand minute-hand" id="minuteHand"></div>
        <div class="clock-hand second-hand" id="secondHand"></div>
      </div>
      <div class="time-display" id="timeDisplay">00:00</div>
      <div class="date-display" id="dateDisplay">2024年1月1日</div>
      <div class="day-display" id="dayDisplay">星期一</div>
    </div>

    <div class="section-title">今日日程</div>
    <div class="schedule-list" id="scheduleList">
      <div class="empty-state">
        <svg><use href="#icon-bell"/></svg>
        <p>还没有日程哦~<br>点击下方 + 按钮添加吧！</p>
      </div>
    </div>
  </div>

  <button class="fab" id="addBtn">
    <svg><use href="#icon-plus"/></svg>
  </button>

  <div class="modal-overlay" id="scheduleModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">添加日程</h2>
        <button class="close-btn" id="closeModal">
          <svg><use href="#icon-close"/></svg>
        </button>
      </div>

      <div class="form-group">
        <label class="form-label">选择图标</label>
        <div class="icon-grid" id="iconGrid">
          <button class="icon-option selected" data-icon="piano" data-title="钢琴课">
            <svg><use href="#icon-piano"/></svg>
            <span>钢琴</span>
          </button>
          <button class="icon-option" data-icon="dance" data-title="跳舞课">
            <svg><use href="#icon-dance"/></svg>
            <span>跳舞</span>
          </button>
          <button class="icon-option" data-icon="english" data-title="英语课">
            <svg><use href="#icon-english"/></svg>
            <span>英语</span>
          </button>
          <button class="icon-option" data-icon="art" data-title="绘画课">
            <svg><use href="#icon-art"/></svg>
            <span>绘画</span>
          </button>
          <button class="icon-option" data-icon="reading" data-title="阅读时间">
            <svg><use href="#icon-reading"/></svg>
            <span>阅读</span>
          </button>
          <button class="icon-option" data-icon="sports" data-title="运动时间">
            <svg><use href="#icon-sports"/></svg>
            <span>运动</span>
          </button>
          <button class="icon-option" data-icon="music" data-title="音乐课">
            <svg><use href="#icon-music"/></svg>
            <span>音乐</span>
          </button>
          <button class="icon-option" data-icon="drawing" data-title="美术课">
            <svg><use href="#icon-drawing"/></svg>
            <span>美术</span>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">日程名称</label>
        <input type="text" class="title-input" id="titleInput" placeholder="给日程起个名字" maxlength="20">
      </div>

      <div class="form-group">
        <label class="form-label">时间</label>
        <div class="time-input-group">
          <input type="number" class="time-input" id="hourInput" min="0" max="23" value="9" placeholder="时">
          <span class="time-separator">:</span>
          <input type="number" class="time-input" id="minuteInput" min="0" max="59" value="0" placeholder="分">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">重复周期</label>
        <div class="day-selector" id="daySelector">
          <button class="day-btn" data-day="0">日</button>
          <button class="day-btn" data-day="1">一</button>
          <button class="day-btn" data-day="2">二</button>
          <button class="day-btn" data-day="3">三</button>
          <button class="day-btn" data-day="4">四</button>
          <button class="day-btn" data-day="5">五</button>
          <button class="day-btn" data-day="6">六</button>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-cancel" id="cancelBtn">取消</button>
        <button class="btn btn-save" id="saveBtn">保存</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="alarmModal">
    <div class="modal alarm-modal">
      <svg class="alarm-icon"><use href="#icon-alarm"/></svg>
      <div class="alarm-title">时间到啦!</div>
      <div class="alarm-schedule-name" id="alarmScheduleName">钢琴课</div>
      <div class="alarm-time" id="alarmTime">09:00</div>
      <button class="btn stop-btn" id="stopAlarmBtn">我知道啦</button>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/alarm.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
